name: Deploy — Vercel Production

# 상태 구분: 이 워크플로의 초록색은 '배포 성공'이 아니다.
#  - DEPLOY_SKIPPED : 필수 secret 누락 → 배포 단계 전체 생략(Vercel Git 연동 등 다른 경로가 배포했을 수 있음)
#  - DEPLOYED       : vercel deploy --prebuilt --prod 성공
#  - 배포/빌드 실패  : 잡 실패(빨강)
#  - 알림(IndexNow/GSC) 실패는 배포와 별개이며 'Notify search engines' 단계에만 표시된다.
# 마지막 'Report deploy state' 단계가 Job Summary에 실제 상태를 기록한다.

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secrets
        id: secrets
        run: |
          missing=""
          for k in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN TURSO_DATABASE_URL TURSO_AUTH_TOKEN; do
            if [ -z "${!k}" ]; then
              missing="${missing} ${k}"
            fi
          done
          if [ -z "${missing}" ]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "missing=${missing# }" >> "$GITHUB_OUTPUT"
            echo "::warning title=배포 생략 (DEPLOY_SKIPPED)::누락된 secret: ${missing# }. 이 실행은 배포하지 않았습니다."
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - uses: pnpm/action-setup@v4
        if: steps.secrets.outputs.can_deploy == 'true'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.can_deploy == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.secrets.outputs.can_deploy == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        if: steps.secrets.outputs.can_deploy == 'true'
        run: pnpm add -g vercel@latest

      - name: Pull Vercel environment
        if: steps.secrets.outputs.can_deploy == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # --prebuilt는 .vercel/output(Build Output API)을 요구한다. 이는 `vercel build`만 만든다(pnpm build는 만들지 않음).
      - name: Build (vercel build)
        if: steps.secrets.outputs.can_deploy == 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: Deploy to Vercel
        id: deploy
        if: steps.secrets.outputs.can_deploy == 'true'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      # 알림 실패는 배포 실패가 아니므로 continue-on-error. 실패 시 이 단계만 주황 경고로 남는다.
      - name: Notify search engines (Google + IndexNow)
        id: notify
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        run: pnpm tsx scripts/notify-published.ts
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      - name: Report deploy state
        if: always()
        run: |
          if [ "${{ steps.secrets.outputs.can_deploy }}" != "true" ]; then
            state="DEPLOY_SKIPPED (누락 secret: ${{ steps.secrets.outputs.missing }})"
          elif [ "${{ steps.deploy.outcome }}" = "success" ]; then
            state="DEPLOYED"
          else
            state="DEPLOY_FAILED"
          fi
          {
            echo "### 배포 상태: ${state}"
            echo ""
            echo "- 검색엔진 알림: ${{ steps.notify.outcome || 'not_run' }} (배포와 별개)"
            echo "- 커밋: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const webhook = process.env.ALERT_SLACK_WEBHOOK_URL;
            if (webhook) {
              await fetch(webhook, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: '⚠️ 펫지기 Vercel 배포 실패. <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|워크플로우 확인>' }) });
            }
        env:
          ALERT_SLACK_WEBHOOK_URL: ${{ secrets.ALERT_SLACK_WEBHOOK_URL }}
