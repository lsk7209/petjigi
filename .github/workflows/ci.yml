name: CI — Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 콘텐츠 게이트가 merge-base 비교를 하려면 전체 이력 필요

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Content gate (PR base)
        if: github.event_name == 'pull_request'
        run: pnpm audit:content:gate -- --base=origin/${{ github.base_ref }}

      - name: Content gate (push)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: pnpm audit:content:gate -- --base=${{ github.event.before }}

      # 운영 DB·시크릿 없이 합성 SQLite fixture로 production build 후 브라우저 검증(광고 판정·본문·고지·비공개 보호).
      - name: Isolated production build + browser e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: pnpm test:e2e
